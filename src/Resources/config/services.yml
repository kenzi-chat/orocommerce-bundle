services:
    kenzi_oro_commerce.application.url_resolver:
        class: Kenzi\OroCommerceBundle\Application\ApplicationUrlResolver
        arguments:
            - '@oro_config.global'
            - '%web_backend_prefix%'

    kenzi_oro_commerce.form.type.connect_button:
        class: Kenzi\OroCommerceBundle\Form\Type\KenziConnectButtonType
        arguments:
            - '@oro_config.global'
            - '@kenzi_oro_commerce.application.url_resolver'
            - '@router'
        tags:
            - { name: form.type }

    kenzi_oro_commerce.oauth.client_factory:
        class: Kenzi\OroCommerceBundle\OAuth\OAuthClientFactory
        arguments:
            - '@oro_oauth2_server.client_manager'
            - '@oro_security.token_accessor'
            - '@logger'
        tags:
            - { name: monolog.logger, channel: kenzi_oro_commerce }

    kenzi_oro_commerce.controller.connect:
        class: Kenzi\OroCommerceBundle\Controller\ConnectController
        arguments:
            - '@oro_config.global'
            - '@http_client'
            - '@kenzi_oro_commerce.oauth.client_factory'
            - '@kenzi_oro_commerce.application.url_resolver'
            - '@logger'
            - '@Oro\Bundle\OAuth2ServerBundle\Security\EncryptionKeysExistenceChecker'
        tags:
            - { name: controller.service_arguments }
            - { name: monolog.logger, channel: kenzi_oro_commerce }

    Kenzi\OroCommerceBundle\Controller\ConnectController:
        alias: kenzi_oro_commerce.controller.connect
        public: true

    kenzi_oro_commerce.layout.data_provider.widget:
        class: Kenzi\OroCommerceBundle\Layout\DataProvider\WidgetDataProvider
        arguments:
            - '@oro_config.manager'
        tags:
            - { name: layout.data_provider, alias: kenzi_widget }

    kenzi_oro_commerce.serializer.order_payload:
        class: Kenzi\OroCommerceBundle\Serializer\OrderPayloadSerializer
        arguments:
            - '@oro_attachment.manager'
            - '@kenzi_oro_commerce.application.url_resolver'

    kenzi_oro_commerce.webhook.dispatcher:
        class: Kenzi\OroCommerceBundle\Webhook\WebhookDispatcher
        arguments:
            - '@http_client'
            - '@oro_config.global'
            - '@kenzi_oro_commerce.application.url_resolver'
            - '@logger'
        tags:
            - { name: monolog.logger, channel: kenzi_oro_commerce }

    # Async — topic and processor for background webhook dispatch
    kenzi_oro_commerce.async.topic.order_webhook:
        class: Kenzi\OroCommerceBundle\Async\OrderWebhookTopic
        tags:
            - { name: oro_message_queue.topic }

    kenzi_oro_commerce.async.processor.order_webhook:
        class: Kenzi\OroCommerceBundle\Async\OrderWebhookProcessor
        arguments:
            - '@doctrine'
            - '@kenzi_oro_commerce.webhook.dispatcher'
            - '@kenzi_oro_commerce.serializer.order_payload'
            - '@oro_message_queue.client.message_producer'
            - '@logger'
        tags:
            - { name: oro_message_queue.client.message_processor }
            - { name: monolog.logger, channel: kenzi_oro_commerce }

    # Event listeners — produce async messages instead of dispatching directly
    kenzi_oro_commerce.event_listener.order_checkout:
        class: Kenzi\OroCommerceBundle\EventListener\OrderCheckoutListener
        arguments:
            - '@oro_message_queue.client.message_producer'
            - '@logger'
        tags:
            - { name: monolog.logger, channel: kenzi_oro_commerce }
            - { name: kernel.event_listener, event: extendable_action.finish_checkout, method: onFinishCheckout, priority: -10 }

    kenzi_oro_commerce.event_listener.order_update:
        class: Kenzi\OroCommerceBundle\EventListener\OrderUpdateListener
        arguments:
            - '@oro_message_queue.client.message_producer'
        tags:
            - { name: doctrine.orm.entity_listener, entity: 'Oro\Bundle\OrderBundle\Entity\Order', event: postUpdate }
